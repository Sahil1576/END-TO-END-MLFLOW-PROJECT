
stages:

  data_ingestion:
    cmd: python -m src.data.Data_Ingestion
    deps:
      - src/data/Data_Ingestion.py
      - config/config.yaml
      - LogHandler/logger.py
      - LogHandler/custome_exception.py
      - notebook/content/True.csv
      - notebook/content/Fake.csv
    outs:
      - data/raw

  data_validation:
    cmd: python -m src.data.Data_Validation
    deps:
      - src/data/Data_Validation.py
      - data/raw
      - LogHandler/logger.py
      - LogHandler/custome_exception.py
      - config/config.yaml
    outs:
      - data/processing/validation_report.json

  data_transformation:
    cmd: python -m src.data.Data_Transformation
    deps:
      - src/data/Data_Transformation.py
      - LogHandler/logger.py
      - LogHandler/custome_exception.py
      - data/processing
      - config/config.yaml
    outs:
      - data/encoding

  model_training:
    cmd: python -m src.model.Model_Trainer
    deps:
      - src/model/Model_Trainer.py
      - LogHandler/logger.py
      - LogHandler/custome_exception.py
      - data/encoding
      - config/config.yaml
    outs:
      - data/models/best_model.pkl
    metrics:
      - data/models/model_report.pkl:
          cache: false

  model_evaluation:
    cmd: python -m src.model.Model_Evaluation
    deps:
      - src/model/Model_Evaluation.py
      - LogHandler/logger.py
      - LogHandler/custome_exception.py
      - data/models/best_model.pkl
      - config/config.yaml
    metrics:
      - data/content/prediction_report.pkl:
          cache: false
